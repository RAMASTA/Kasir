<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Kedai Minuman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        @media print {
            body * { visibility: hidden; }
            #receipt, #receipt * { visibility: visible; }
            #receipt { position: absolute; left: 0; top: 0; width: 58mm; font-size: 12px; color: black; }
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden select-none">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl">
        <div class="p-5 font-bold text-xl border-b border-slate-700">
            <i class="fa-solid fa-mug-hot text-blue-500 mr-2"></i> DRINK POS
        </div>
        <nav class="flex-1 py-4 space-y-1">
            <a href="#" class="block px-5 py-3 bg-slate-800 border-l-4 border-blue-500"><i class="fa-solid fa-cash-register w-6"></i> Kasir</a>
        </nav>
    </aside>

    <!-- KASIR & PRODUK -->
    <main class="flex-1 flex h-full">
        <!-- Grid Produk -->
        <div class="flex-1 overflow-y-auto p-4 grid grid-cols-2 lg:grid-cols-4 gap-4 bg-gray-50 content-start" id="product-grid">
            <!-- Dimuat oleh JS -->
        </div>

        <!-- Keranjang -->
        <div class="w-96 bg-white shadow-xl flex flex-col z-10 border-l">
            <div class="p-4 bg-slate-900 text-white font-bold"><i class="fa-solid fa-basket-shopping"></i> Keranjang</div>
            <div class="flex-1 overflow-y-auto p-3 space-y-2" id="cart-items">
                <div class="text-center text-gray-400 mt-10 text-sm" id="empty-msg">Keranjang kosong</div>
            </div>
            <div class="p-4 border-t bg-gray-50">
                <div class="flex justify-between font-bold text-xl mb-4"><span>TOTAL</span> <span id="cart-total">Rp0</span></div>
                <button onclick="openPayment()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">BAYAR (F4)</button>
            </div>
        </div>
    </main>

    <!-- MODAL PEMBAYARAN -->
    <div id="modal-payment" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden">
            <div class="p-5 bg-blue-600 text-white text-center">
                <h3 class="text-blue-100 text-sm">TOTAL PEMBAYARAN</h3>
                <h2 class="font-bold text-3xl mt-1" id="pay-total-display">Rp0</h2>
            </div>
            <div class="p-5">
                <label class="block font-bold text-gray-700 mb-2 text-sm">UANG DITERIMA (TUNAI)</label>
                <input type="number" id="input-cash" class="w-full text-xl font-bold p-3 border rounded-xl mb-4 text-right" placeholder="0">
                <div class="flex justify-between mb-4 bg-gray-100 p-2 rounded">
                    <span class="font-bold text-gray-600">KEMBALI:</span>
                    <span class="font-bold text-green-600 text-xl" id="pay-change">Rp0</span>
                </div>
                <div class="flex space-x-2">
                    <button onclick="closePayment()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-bold">BATAL (ESC)</button>
                    <button onclick="processPayment()" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold shadow-lg">PROSES</button>
                </div>
            </div>
        </div>
    </div>

    <!-- STRUK PRINT -->
    <div id="receipt" class="hidden font-mono text-xs w-[58mm] bg-white p-2">
        <div class="text-center mb-2"><h2 class="font-bold text-sm">DRINK POS</h2></div>
        <div class="border-b border-dashed pb-1 mb-1" id="rec-trx"></div>
        <div id="rec-items" class="border-b border-dashed pb-1 mb-1"></div>
        <div class="flex justify-between font-bold"><span>TOTAL</span><span id="rec-total"></span></div>
        <div class="flex justify-between"><span>TUNAI</span><span id="rec-cash"></span></div>
        <div class="flex justify-between"><span>KEMBALI</span><span id="rec-change"></span></div>
        <div class="text-center mt-3">Terima Kasih</div>
    </div>

    <script>
        const products = [
            { id: 1, name: 'Matcha Latte', price: 15000, img: 'https://images.unsplash.com/photo-1515823662972-da6a2b4d3002?w=300&h=300&fit=crop' },
            { id: 2, name: 'Thai Tea', price: 12000, img: 'https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=300&h=300&fit=crop' },
            { id: 3, name: 'Chocolate', price: 13000, img: 'https://images.unsplash.com/photo-1541167760496-1628856ab772?w=300&h=300&fit=crop' },
            { id: 4, name: 'Coffee Latte', price: 18000, img: 'https://images.unsplash.com/photo-1570968915860-54d5c310fa6d?w=300&h=300&fit=crop' }
        ];

        let cart = [];
        const formatRp = (num) => 'Rp' + parseInt(num).toLocaleString('id-ID');

        window.onload = () => {
            document.getElementById('product-grid').innerHTML = products.map(p => `
                <div onclick="addToCart(${p.id})" class="bg-white rounded-xl shadow-sm border overflow-hidden cursor-pointer hover:border-blue-500">
                    <img src="${p.img}" class="h-32 w-full object-cover">
                    <div class="p-3">
                        <h3 class="font-bold text-gray-800 text-sm">${p.name}</h3>
                        <p class="text-blue-600 font-bold mt-1">${formatRp(p.price)}</p>
                    </div>
                </div>
            `).join('');
        };

        function addToCart(id) {
            const product = products.find(p => p.id == id);
            const existing = cart.find(c => c.id == id);
            if(existing) existing.qty++;
            else cart.push({ ...product, qty: 1 });
            updateCart();
        }

        function updateCart() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-total').innerText = formatRp(total);
            document.getElementById('empty-msg').style.display = cart.length ? 'none' : 'block';
            
            document.getElementById('cart-items').innerHTML = cart.map((item, idx) => `
                <div class="bg-white border rounded p-2 flex justify-between items-center">
                    <div>
                        <div class="font-bold text-sm text-gray-800">${item.name}</div>
                        <div class="text-blue-600 text-xs">${formatRp(item.price)}</div>
                    </div>
                    <div class="flex items-center space-x-2 bg-gray-100 rounded px-2">
                        <button onclick="changeQty(${idx}, -1)" class="w-5 font-bold">-</button>
                        <span class="text-sm font-bold w-4 text-center">${item.qty}</span>
                        <button onclick="changeQty(${idx}, 1)" class="w-5 font-bold">+</button>
                    </div>
                </div>
            `).join('');
        }

        function changeQty(idx, delta) {
            cart[idx].qty += delta;
            if(cart[idx].qty <= 0) cart.splice(idx, 1);
            updateCart();
        }

        function openPayment() {
            if(!cart.length) return Swal.fire({icon:'error', title:'Keranjang kosong!'});
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('pay-total-display').innerText = formatRp(total);
            document.getElementById('input-cash').value = '';
            document.getElementById('pay-change').innerText = 'Rp0';
            document.getElementById('modal-payment').classList.remove('hidden');
            setTimeout(() => document.getElementById('input-cash').focus(), 100);
        }

        function closePayment() { document.getElementById('modal-payment').classList.add('hidden'); }

        document.getElementById('input-cash').addEventListener('input', function() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const change = (parseInt(this.value) || 0) - total;
            document.getElementById('pay-change').innerText = change >= 0 ? formatRp(change) : 'Rp0';
            document.getElementById('pay-change').className = change >= 0 ? 'font-bold text-green-600 text-xl' : 'font-bold text-red-500 text-xl';
        });

        function processPayment() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const cash = parseInt(document.getElementById('input-cash').value) || 0;
            if(cash < total) return Swal.fire({icon: 'error', title: 'Uang Kurang'});
            
            const trxId = 'TRX-' + new Date().getTime();
            const data = { id: trxId, total, tendered: cash, change: cash - total, items: cart };

            // Simpan ke LocalStorage agar data tidak hilang saat di-refresh
            let history = JSON.parse(localStorage.getItem('pos_history')) || [];
            history.push(data);
            localStorage.setItem('pos_history', JSON.stringify(history));

            printReceipt(data);
            cart = []; updateCart(); closePayment();
            Swal.fire({icon: 'success', title: 'Berhasil', timer: 1500, showConfirmButton: false});
        }

        function printReceipt(data) {
            document.getElementById('receipt').classList.remove('hidden');
            document.getElementById('rec-trx').innerText = data.id;
            document.getElementById('rec-items').innerHTML = data.items.map(i => `
                <div class="flex justify-between"><span>${i.name}</span><span>${formatRp(i.price*i.qty)}</span></div>
                <div class="text-[10px] text-gray-500">${i.qty}x @${formatRp(i.price)}</div>
            `).join('');
            document.getElementById('rec-total').innerText = formatRp(data.total);
            document.getElementById('rec-cash').innerText = formatRp(data.tendered);
            document.getElementById('rec-change').innerText = formatRp(data.change);
            window.print();
            document.getElementById('receipt').classList.add('hidden');
        }

        window.addEventListener('keydown', (e) => {
            if(e.key === 'F4') { e.preventDefault(); openPayment(); }
            if(e.key === 'Escape') closePayment();
        });
    </script>
</body>
</html>
