<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Kasir Sederhana</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        .input-group { margin-bottom: 15px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        .summary { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Aplikasi Kasir (POS)</h1>
        
        <div class="input-group">
            <label>Scan Barcode (Coba ketik: <strong>111</strong>, <strong>222</strong>, atau <strong>333</strong>) lalu tekan Enter pada keyboard:</label>
            <input type="text" id="barcodeInput" placeholder="Scan atau ketik barcode..." onkeypress="handleScan(event)">
        </div>

        <h2>Keranjang Belanja</h2>
        <table id="cartTable">
            <thead>
                <tr>
                    <th>Nama Barang</th>
                    <th>Harga</th>
                    <th>Qty</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody id="cartBody">
                <!-- Item akan muncul di sini -->
            </tbody>
        </table>

        <div class="summary">
            <h3>Total Belanja: Rp <span id="totalBelanja">0</span></h3>
            <div class="input-group">
                <label>Uang Pelanggan (Rp):</label>
                <input type="number" id="uangPelanggan" placeholder="Masukkan jumlah uang..." oninput="hitungKembalian()">
            </div>
            <h3>Kembalian: Rp <span id="kembalian">0</span></h3>
            <button onclick="simpanTransaksi()">Simpan Transaksi</button>
        </div>

        <hr style="margin: 30px 0;">

        <h2>Laporan Pendapatan Bulan Ini</h2>
        <button onclick="hitungPendapatan()">Hitung Pendapatan (Sistem Looping)</button>
        <h3 style="color: #28a745;">Total Pendapatan: Rp <span id="totalPendapatan">0</span></h3>
        <ul id="listTransaksi"></ul>
    </div>

    <script>
        // Simulasi Database Barang (Pengganti Backend)
        const databaseBarang = [
            { barcode: '111', nama: 'Kopi Kapal Api', harga: 5000 },
            { barcode: '222', nama: 'Roti Sari Roti', harga: 12000 },
            { barcode: '333', nama: 'Susu Indomilk', harga: 6000 }
        ];

        let keranjang = [];
        
        // Simulasi Database Transaksi (Berisi data awal untuk contoh looping)
        let riwayatTransaksi = [
            { id: 1, total: 25000, tanggal: '2026-11-01' },
            { id: 2, total: 15000, tanggal: '2026-11-05' }
        ];

        // Fitur 1: Scan Barcode
        function handleScan(event) {
            if (event.key === 'Enter') {
                let barcode = document.getElementById('barcodeInput').value;
                let barang = databaseBarang.find(b => b.barcode === barcode);
                
                if (barang) {
                    let itemDiKeranjang = keranjang.find(k => k.barcode === barcode);
                    if (itemDiKeranjang) {
                        itemDiKeranjang.qty += 1;
                    } else {
                        keranjang.push({ ...barang, qty: 1 });
                    }
                    updateTabelKeranjang();
                } else {
                    alert('Barang tidak ditemukan di sistem!');
                }
                document.getElementById('barcodeInput').value = ''; // Reset input
            }
        }

        // Fitur 2: Hitung Total
        function updateTabelKeranjang() {
            let tbody = document.getElementById('cartBody');
            tbody.innerHTML = '';
            let total = 0;

            keranjang.forEach(item => {
                let subtotal = item.harga * item.qty;
                total += subtotal;
                tbody.innerHTML += `
                    <tr>
                        <td>${item.nama}</td>
                        <td>${item.harga}</td>
                        <td>${item.qty}</td>
                        <td>${subtotal}</td>
                    </tr>
                `;
            });

            document.getElementById('totalBelanja').innerText = total;
            hitungKembalian(); // Update otomatis saat keranjang berubah
        }

        // Fitur 3: Hitung Kembalian Pelanggan
        function hitungKembalian() {
            let total = parseInt(document.getElementById('totalBelanja').innerText) || 0;
            let uang = parseInt(document.getElementById('uangPelanggan').value) || 0;
            let kembalian = uang - total;
            
            let elemenKembalian = document.getElementById('kembalian');
            if (uang > 0 && kembalian < 0) {
                elemenKembalian.innerText = "Uang Kurang!";
                elemenKembalian.style.color = "red";
            } else {
                elemenKembalian.innerText = kembalian;
                elemenKembalian.style.color = "black";
            }
        }

        // Fitur 4: Simpan Transaksi
        function simpanTransaksi() {
            let total = parseInt(document.getElementById('totalBelanja').innerText) || 0;
            let uang = parseInt(document.getElementById('uangPelanggan').value) || 0;

            if (keranjang.length === 0) {
                alert('Keranjang masih kosong!');
                return;
            }
            if (uang < total) {
                alert('Transaksi gagal: Uang pelanggan kurang!');
                return;
            }

            riwayatTransaksi.push({
                id: riwayatTransaksi.length + 1,
                total: total,
                tanggal: new Date().toISOString().split('T')[0]
            });

            alert('Transaksi Berhasil Disimpan!');
            keranjang = [];
            document.getElementById('uangPelanggan').value = '';
            updateTabelKeranjang();
        }

        // Fitur 5: Hitung Pendapatan dengan Looping
        function hitungPendapatan() {
            let totalPendapatan = 0;
            let listHtml = '';
            
            // Logika Looping Array untuk menjumlahkan semua transaksi
            for (let i = 0; i < riwayatTransaksi.length; i++) {
                totalPendapatan += riwayatTransaksi[i].total;
                listHtml += `<li>Transaksi #${riwayatTransaksi[i].id} - Rp ${riwayatTransaksi[i].total} (${riwayatTransaksi[i].tanggal})</li>`;
            }

            document.getElementById('totalPendapatan').innerText = totalPendapatan;
            document.getElementById('listTransaksi').innerHTML = listHtml;
        }
    </script>
</body>
</html>
